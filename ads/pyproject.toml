[project]
name = "ads"
version = "0.0.0"
description = "たむらこどもクリニック 看護師募集のリスティング広告運用CLI（Google 広告）"
requires-python = ">=3.10"
dependencies = [
    "google-ads>=25.1.0",
    "google-auth-oauthlib>=1.2.0",
    "click>=8.1.7",
    "rich>=13.9.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
gads = "gads.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gads"]
